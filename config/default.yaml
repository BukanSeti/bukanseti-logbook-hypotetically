project_name: INTERNATIONAL CORADINE
revision: 3
airline:
  name: Lion Air
  accepted_names: ["Lion Air", "LION AIR"]
  accepted_iata_prefixes: ["JT"]
  accepted_icao_prefixes: ["LNI"]
  reject_other_airlines: true
processing:
  require_start_processing_flag: true
  rows_per_print_page: 24
  default_turnaround_minutes: 45
  strict_pdf_from_excel: true
  allow_reportlab_fallback: false
  leave_missing_approach_unverified: true
references:
  mode: remote
  required: false
  api_url_env: CORADINE_REFERENCE_API_URL
  api_token_env: CORADINE_REFERENCE_API_TOKEN
  request_timeout_seconds: 15
  allow_local_admin_fallback: false
  crew_cache: ".cache/Lion_Air_Crew.xlsx"
  aircraft_cache: ".cache/Lion_Air_Airplane.xlsx"
output:
  workbook_name: International_Coradine.xlsx
  pdf_name: International_Coradine.pdf
