services:
  - type: web
    name: coradine-private-reference-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile.reference-api
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: LION_AIR_CREW_SHEET_ID
        sync: false
      - key: LION_AIR_AIRCRAFT_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORADINE_API_TOKEN_HASHES
        sync: false
      - key: CORADINE_API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CORADINE_REFERENCE_CACHE_TTL_SECONDS
        value: "300"
      - key: CORADINE_API_DOCS
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
